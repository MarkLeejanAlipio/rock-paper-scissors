<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="header">
            <h1 class="game-title">RPS ARENA</h1>
            <button class="pa-btn">Play Again</button>
        </div>
        <div class="scores">
            <div class="player-info">
                <p class="player">YOU</p>
                <p class="human-score">0</p>
            </div>
            <p class="vs">VS</p>
            <div class="player-info">
                <p class="player">CPU</p>
                <p class="computer-score">0</p>
            </div>
        </div>
        <div class="round-result">
            <p class="show-choice">CHOOSE YOUR MOVE</p>
        </div>
        <div class="choices">
            <button id="rock" class="choice-info">
                <p class="choice">🪨</p>
                <p class="choice-name">ROCK</p>                
            </button>
            <button id="paper" class="choice-info">
                <p class="choice">📃</p>
                <p class="choice-name">PAPER</p>                
            </button>
            <button id="scissor" class="choice-info">
                <p class="choice">✂️</p>
                <p class="choice-name">SCISSOR</p>                
            </button>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
