<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Rock Paper Scissors</h1>
    <div class="container">
        <button class="choice" data-choice="Rock">
            <img src="images/rock.png" alt="Rock">
        </button>
        <button class="choice" data-choice="Paper">
            <img src="images/paper.jpg" alt="Paper">
        </button>
        <button class="choice" data-choice="Scissors">
            <img src="images/scissors.jpg" alt="Scissors">
        </button>
    </div>
    <div class="choice-container">
        <p class="human-choice"></p>
        <p class="computer-choice"></p>
    </div>
    <script src="index.js"></script>
</body>
</html>
